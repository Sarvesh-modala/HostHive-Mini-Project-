{% extends 'base/base.html' %}

{% block title %}Delete Category - HostHive{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5 text-center">
                    <i class="fas fa-exclamation-triangle fa-4x text-warning mb-4"></i>
                    <h2 class="fw-bold mb-3">Delete Category</h2>
                    <p class="text-muted mb-4">
                        Are you sure you want to delete "<strong>{{ category.name }}</strong>"? 
                        This action cannot be undone and will affect all events in this category.
                    </p>
                    
                    <form method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger me-3">
                            <i class="fas fa-trash me-2"></i>Yes, Delete
                        </button>
                    </form>
                    
                    <a href="{% url 'categories:detail' category.pk %}" class="btn btn-outline-secondary">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
